# Gebauer Real Estate – Netlify-Konfiguration
# Hauptdomain: https://gebauer-property.com  (EN /, DE /de/, FR /fr/, IT /it/)
# gebauer-property.ch und optional gebauer-realestate.com sind Domain-Aliase und leiten per 301 weiter.

[build]
  publish = "."
  command = ""

# --- www -> ohne www -----------------------------------------------------
[[redirects]]
  from = "https://www.gebauer-property.com/*"
  to = "https://gebauer-property.com/:splat"
  status = 301
  force = true

# --- gebauer-property.ch -> .com (Schweizer Domain landet auf Deutsch) ----
[[redirects]]
  from = "https://gebauer-property.ch/fr/*"
  to = "https://gebauer-property.com/fr/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://gebauer-property.ch/it/*"
  to = "https://gebauer-property.com/it/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://gebauer-property.ch/*"
  to = "https://gebauer-property.com/de/"
  status = 301
  force = true
[[redirects]]
  from = "https://www.gebauer-property.ch/fr/*"
  to = "https://gebauer-property.com/fr/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.gebauer-property.ch/it/*"
  to = "https://gebauer-property.com/it/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.gebauer-property.ch/*"
  to = "https://gebauer-property.com/de/"
  status = 301
  force = true

# --- optional: gebauer-realestate.com (Markenschutz) -> .com --------------
[[redirects]]
  from = "https://gebauer-realestate.com/*"
  to = "https://gebauer-property.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.gebauer-realestate.com/*"
  to = "https://gebauer-property.com/:splat"
  status = 301
  force = true

# --- interne Ordner nicht öffentlich ---------------------------------------
[[redirects]]
  from = "/src/*"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/tools/*"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
